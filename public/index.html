<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fúria Mods IA</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>FÚRIA MODS</small><h1>Analisador de Mods</h1><p>Primeira etapa: baixar e analisar o arquivo no servidor.</p></div><b>V2.0</b></header><section class="card"><h2>🔗 Analisar um mod</h2><p>Por enquanto, cole um link direto para um arquivo ZIP.</p><form id="f"><input id="u" type="url" placeholder="https://..." required><button>Analisar mod</button></form><div id="s" class="status"></div></section><section id="r" hidden><div class="grid"><article class="card"><h2>📦 Arquivo</h2><div id="i"></div></article><article class="card"><h2>🔎 Estrutura</h2><div id="st"></div></article></div><article class="card"><h2>📝 Prévia Fúria Mods</h2><div class="preview" id="p"></div><button id="a">✅ Aprovar para próxima etapa</button></article></section></main><script>const f=document.querySelector('#f'),s=document.querySelector('#s'),r=document.querySelector('#r');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const mb=x=>(x/1048576).toFixed(2)+' MB';f.onsubmit=async e=>{e.preventDefault();s.textContent='Baixando e analisando no servidor...';try{let q=await fetch('/api/analyze-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u.value.trim()})}),d=await q.json();if(!q.ok)throw Error(d.error);let x=d.analysis,p=d.post;i.innerHTML=`<p><b>Tamanho:</b> ${mb(d.source.bytes)}</p><p><b>Arquivos:</b> ${x.totalFiles}</p><p><b>Imagens:</b> ${x.images.length}</p><p><b>meta.xml:</b> ${x.meta?'Encontrado':'Não encontrado'}</p>`;st.innerHTML=`<p><b>Raízes:</b></p><div class="chips">${x.topLevel.map(z=>`<span>${esc(z)}</span>`).join('')||'Nenhuma'}</div><p><b>Arquivos de texto/configuração:</b> ${x.interestingText.length}</p>`;document.querySelector('#p').innerHTML=`<h3>${esc(p.titulo)}</h3><hr><h4>Imagem:</h4><p>${x.images.length} imagem(ns) encontrada(s).</p><h4>Informações:</h4><p><b>Descrição:</b> ${esc(p.descricao)}</p><p><b>Autor:</b> ${esc(p.autor)}</p><p><b>Comandos:</b> ${esc(p.comandos)}</p><p><b>Peso:</b> ${esc(p.peso)}</p><p><b>Link:</b> ${esc(p.link)}</p><button>DOWNLOAD</button><p class="note">Prévia estrutural. A IA de conteúdo entra na próxima camada, depois de validarmos esta base.</p>`;r.hidden=false;s.textContent='✅ Análise concluída.'}catch(e){s.textContent='❌ '+e.message}};document.querySelector('#a').onclick=()=>alert('Aprovação preparada. Nesta versão ainda não enviamos para ShareMods nem Blogger.');</script></body></html>
