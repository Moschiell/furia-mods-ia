<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fúria Mods — Analisador de Mods</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><header><h1>FÚRIA MODS</h1><p>Analisador de Mods · V3.0</p></header><section class="card"><label for="url">Link do mod</label><input id="url" type="url" placeholder="Cole o link do MediaFire ou o link direto do ZIP"><button id="analyze">Analisar mod</button><p class="hint">O servidor tenta resolver o download automaticamente. Você não precisa baixar o ZIP no celular.</p><div id="status"></div></section><section id="result" class="hidden"><div class="card"><h2>Arquivo</h2><div id="file"></div></div><div class="card"><h2>Estrutura</h2><pre id="structure"></pre></div><div class="card"><h2>Prévia Fúria Mods</h2><div id="preview"></div><button class="approve" id="approve">✅ Aprovar para próxima etapa</button></div></section></main><script>
const $=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function status(m,e=false){$("status").textContent=m;$("status").className=e?"error":"ok"}$('analyze').onclick=async()=>{const url=$("url").value.trim();if(!url)return status("Cole o link do mod primeiro.",true);status("Acessando o link e procurando o ZIP no servidor...");$("result").classList.add("hidden");$("analyze").disabled=true;try{const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Falha na análise.");status("Análise concluída.");$("result").classList.remove("hidden");$("file").innerHTML="<strong>"+esc(d.file.name)+"</strong><br>"+d.file.sizeMB+" MB · "+d.analysis.fileCount+" arquivos";$("structure").textContent=JSON.stringify({pastas_principais:d.analysis.topLevel,imagens:d.analysis.images,meta_xml_encontrado:!!d.analysis.metaXml,readme_encontrado:!!d.analysis.readme,arquivos_texto:d.analysis.textFiles},null,2);const p=d.preview;$("preview").innerHTML="<div class='preview'><h3>"+esc(p.titulo)+"</h3><p><b>Descrição:</b> "+esc(p.descricao)+"</p><p><b>Autor:</b> "+esc(p.autor)+"</p><p><b>Comandos:</b> "+esc(p.comandos)+"</p><p><b>Peso:</b> "+esc(p.peso)+"</p><p><b>Imagem:</b> "+esc(p.imagem||"Nenhuma identificada")+"</p></div>"}catch(e){status(e.message,true)}finally{$("analyze").disabled=false}};$('approve').onclick=()=>status("Aprovado. A etapa de geração final da publicação será adicionada depois.");</script></body></html>
